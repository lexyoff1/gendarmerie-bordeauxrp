<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Demande de Renfort</title>
    <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  color: #e0e0e0;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: rgba(0, 0, 0, 0.5);
  border-bottom: 3px solid #d4af37;
  padding: 2rem;
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
  max-width: 1200px;
  margin-left: auto;
  margin-right: auto;
}

.logo {
  width: 80px;
  height: 80px;
  object-fit: contain;
  filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.5));
}

.brand h1 {
  font-size: 2.5rem;
  color: #d4af37;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
}

.brand p {
  font-size: 0.95rem;
  color: #b0b0b0;
}

nav {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
  max-width: 1200px;
  margin: 0 auto;
}

nav a {
  color: #d4af37;
  text-decoration: none;
  padding: 0.5rem 1rem;
  border: 1px solid #d4af37;
  border-radius: 4px;
  transition: all 0.3s ease;
  font-weight: 500;
  font-size: 0.9rem;
}

nav a:hover {
  background: #d4af37;
  color: #1a1a2e;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
}

section {
  flex: 1;
  padding: 3rem 2rem;
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
}

.card {
  background: rgba(30, 30, 50, 0.8);
  border: 2px solid #d4af37;
  border-radius: 8px;
  padding: 2rem;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}

.card h2 {
  font-size: 2rem;
  color: #d4af37;
  margin-bottom: 2rem;
  text-align: center;
  border-bottom: 2px solid #d4af37;
  padding-bottom: 1rem;
}

form {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

label {
  color: #d0d0d0;
  font-weight: 500;
  display: block;
  margin-bottom: 0.5rem;
}

label input[type="checkbox"],
label input[type="radio"] {
  margin-right: 0.5rem;
  cursor: pointer;
  accent-color: #d4af37;
}

label:has(input[type="checkbox"]),
label:has(input[type="radio"]) {
  display: flex;
  align-items: center;
  margin-bottom: 0.8rem;
  margin-top: -0.3rem;
  font-weight: normal;
}

input[type="text"],
input[type="number"],
textarea {
  width: 100%;
  padding: 0.8rem;
  background: rgba(20, 20, 40, 0.8);
  border: 1px solid #d4af37;
  border-radius: 4px;
  color: #e0e0e0;
  font-family: inherit;
  font-size: 1rem;
  transition: all 0.3s ease;
}

input[type="text"]:focus,
input[type="number"]:focus,
textarea:focus {
  outline: none;
  background: rgba(30, 30, 50, 0.9);
  border-color: #fff9e6;
  box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
}

textarea {
  resize: vertical;
  min-height: 100px;
}

.checkbox-group {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 0.5rem;
  margin-bottom: 1rem;
}

button {
  padding: 1rem;
  background: linear-gradient(135deg, #d4af37 0%, #b8941f 100%);
  color: #1a1a2e;
  border: none;
  border-radius: 4px;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 16px rgba(212, 175, 55, 0.4);
}

button:active {
  transform: translateY(0);
}

footer {
  background: rgba(0, 0, 0, 0.7);
  border-top: 2px solid #d4af37;
  padding: 2rem;
  text-align: center;
  color: #b0b0b0;
  font-size: 0.9rem;
  margin-top: auto;
}

footer p {
  margin: 0.5rem 0;
}

@media (max-width: 768px) {
  header {
    padding: 1.5rem;
  }

  .brand {
    flex-direction: column;
    text-align: center;
    margin-bottom: 1rem;
  }

  .brand h1 {
    font-size: 1.8rem;
  }

  nav {
    gap: 0.6rem;
  }

  nav a {
    font-size: 0.8rem;
    padding: 0.4rem 0.6rem;
  }

  section {
    padding: 1.5rem 1rem;
  }

  .card {
    padding: 1.5rem;
  }

  .card h2 {
    font-size: 1.5rem;
  }

  .checkbox-group {
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  }
}

@media (max-width: 480px) {
  header {
    padding: 1rem;
  }

  .brand h1 {
    font-size: 1.5rem;
  }

  .brand p {
    font-size: 0.85rem;
  }

  nav a {
    font-size: 0.7rem;
    padding: 0.3rem 0.5rem;
  }

  section {
    padding: 1rem 0.75rem;
  }

  .card {
    padding: 1rem;
  }

  .card h2 {
    font-size: 1.2rem;
  }

  .checkbox-group {
    grid-template-columns: 1fr;
  }

  input[type="text"],
  input[type="number"],
  textarea {
    font-size: 16px;
  }
}
    </style>
</head>
<body>

<header>
    <div class="brand">
        <img src="/assets/logo-gendarmerie.png" class="logo" alt="Logo Gendarmerie">
        <div>
            <h1>Demande de Renfort</h1>
            <p>Gendarmerie Nationale</p>
        </div>
    </div>

    <nav>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/logout">Déconnexion</a>
    </nav>
</header>

<section>
    <div class="card">
        <h2>📡 Demande de Renfort</h2>

        <form id="renfortForm">
            <div>
                <label for="nombreMilitaires">Nombre de Militaires en Service</label>
                <input id="nombreMilitaires" type="number" min="1" required>
            </div>

            <div>
                <label for="unitePatrouille">Unité / Patrouille Présente En Ville</label>
                <input id="unitePatrouille" type="text" required>
            </div>

            <div>
                <label for="raison">Raison</label>
                <textarea id="raison" required></textarea>
            </div>

            <div>
                <label>Spécialisation Demandée</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" value="Territoriale"> Territoriale</label>
                    <label><input type="checkbox" value="PSIG"> PSIG</label>
                    <label><input type="checkbox" value="AGIGN"> AGIGN</label>
                    <label><input type="checkbox" value="BDR / PJGN"> BDR / PJGN</label>
                    <label><input type="checkbox" value="Gendarmerie Mobile"> Gendarmerie Mobile</label>
                    <label><input type="checkbox" value="PGHM"> PGHM</label>
                    <label><input type="checkbox" value="GIC"> GIC</label>
                    <label><input type="checkbox" value="EDCF"> EDCF</label>
                </div>
            </div>

            <button type="submit">Envoyer la demande</button>
        </form>
    </div>
</section>

<script>
document.getElementById("renfortForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const specialisations = Array.from(document.querySelectorAll("input[type='checkbox']:checked"))
        .map(input => input.value);

    const res = await fetch((window.API_BASE || "") + "/api/renfort", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            nombreMilitaires: document.getElementById("nombreMilitaires").value,
            unitePatrouille: document.getElementById("unitePatrouille").value,
            raison: document.getElementById("raison").value,
            specialisations
        })
    });

    const data = await res.json();

    if (!res.ok) {
        alert(data.error || "Erreur.");
        return;
    }

    alert("Demande de renfort envoyée.");
    location.reload();
});
</script>

<footer class="footer">
    <p>© 2026 lexy_off1 — Tous droits réservés</p>
</footer>

</body>
</html>
