<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gendarmerie Nationale</title>
    <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  color: #e0e0e0;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: rgba(0, 0, 0, 0.5);
  border-bottom: 3px solid #d4af37;
  padding: 2rem;
  backdrop-filter: blur(10px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  max-width: 1200px;
  margin: 0 auto;
}

.logo {
  width: 80px;
  height: 80px;
  object-fit: contain;
  filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.5));
}

.brand h1 {
  font-size: 2.5rem;
  color: #d4af37;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
}

.back-btn {
  display: inline-block;
  margin-left: auto;
  background: rgba(212, 175, 55, 0.1);
  color: #d4af37;
  border: 2px solid #d4af37;
  padding: 0.6rem 1.5rem;
  border-radius: 6px;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 600;
}

.back-btn:hover {
  background: #d4af37;
  color: #1a1a2e;
  transform: translateY(-2px);
}

main {
  flex: 1;
  padding: 3rem 2rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-container {
  background: rgba(0, 0, 0, 0.4);
  border: 2px solid #d4af37;
  border-radius: 12px;
  padding: 3rem;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 8px 32px rgba(212, 175, 55, 0.2);
}

.login-container h2 {
  color: #d4af37;
  margin-bottom: 2rem;
  text-align: center;
  font-size: 1.8rem;
}

.form-group {
  margin-bottom: 1.5rem;
}

label {
  display: block;
  margin-bottom: 0.5rem;
  color: #d4af37;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 0.8rem;
  border: 2px solid #d4af37;
  border-radius: 6px;
  background: rgba(212, 175, 55, 0.05);
  color: #e0e0e0;
  font-family: inherit;
  font-size: 1rem;
  transition: all 0.3s ease;
}

input:focus {
  outline: none;
  background: rgba(212, 175, 55, 0.15);
  box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
}

.submit-btn {
  background: linear-gradient(135deg, #d4af37 0%, #c9a227 100%);
  color: #1a1a2e;
  border: none;
  padding: 0.8rem;
  font-size: 1rem;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 100%;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
}

.submit-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(212, 175, 55, 0.4);
}

.success-message {
  background: rgba(76, 175, 80, 0.2);
  border: 2px solid #4CAF50;
  color: #90EE90;
  padding: 1rem;
  border-radius: 6px;
  margin-bottom: 2rem;
  display: none;
  text-align: center;
}

footer {
  background: rgba(0, 0, 0, 0.7);
  border-top: 2px solid #d4af37;
  padding: 2rem;
  text-align: center;
  color: #b0b0b0;
  font-size: 0.9rem;
}

@media (max-width: 768px) {
  header {
    padding: 1.5rem;
  }

  .brand {
    flex-direction: column;
    text-align: center;
  }

  .back-btn {
    margin-left: 0;
    margin-top: 1rem;
  }

  .brand h1 {
    font-size: 1.8rem;
  }

  .login-container {
    padding: 2rem;
  }

  main {
    padding: 2rem 1.5rem;
  }
}

@media (max-width: 480px) {
  header {
    padding: 1rem;
  }

  .brand h1 {
    font-size: 1.5rem;
  }

  .logo {
    width: 60px;
    height: 60px;
  }

  .login-container {
    padding: 1.5rem;
  }

  .login-container h2 {
    font-size: 1.5rem;
  }

  main {
    padding: 1.5rem 1rem;
  }
}
    

/* En-tete propre a cette page */
body > header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 24px;
  width: 100%;
  min-height: 84px;
  padding: 12px clamp(16px, 4vw, 52px);
  color: #f4f6fb;
  background: linear-gradient(110deg, rgba(5, 10, 24, 0.98), rgba(10, 19, 48, 0.96) 58%, rgba(8, 15, 35, 0.98));
  border-bottom: 1px solid rgba(212, 175, 55, 0.32);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
  backdrop-filter: blur(10px);
}

body > header > .brand,
body > header > .header-inner {
  display: flex;
  flex: 1 1 auto;
  align-items: center;
  justify-content: space-between;
  gap: clamp(14px, 2.5vw, 32px);
  min-width: 0;
  width: 100%;
  margin: 0;
}

body > header .brand-home {
  display: flex;
  flex: 0 1 auto;
  flex-direction: row;
  align-items: center;
  gap: 14px;
  min-width: 0;
  color: inherit;
  text-decoration: none;
  border-radius: 10px;
}

body > header .brand-home:hover {
  color: inherit;
  text-decoration: none;
  filter: brightness(1.1);
}

body > header .brand-home:focus-visible {
  outline: 2px solid #e6c866;
  outline-offset: 5px;
}

body > header .logo {
  width: 56px;
  height: 56px;
  flex: 0 0 auto;
  padding: 4px;
  object-fit: contain;
  border: 1px solid rgba(230, 200, 102, 0.42);
  border-radius: 15px;
  background: rgba(212, 175, 55, 0.06);
  filter: drop-shadow(0 4px 10px rgba(212, 175, 55, 0.18));
}

body > header h1,
body > header .brand-text strong {
  margin: 0;
  color: #e6c866;
  font-size: clamp(1.05rem, 1.8vw, 1.4rem);
  line-height: 1.2;
  letter-spacing: 0.01em;
  text-shadow: 0 2px 12px rgba(212, 175, 55, 0.18);
}

body > header .brand p,
body > header .brand-text > span {
  margin: 4px 0 0;
  color: #9aa6c4;
  font-size: 0.84rem;
  line-height: 1.35;
}

body > header nav {
  display: flex;
  flex: 0 1 auto;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  width: auto;
  max-width: 100%;
  margin: 0;
}

body > header nav a,
body > header .back-btn,
body > header .login-btn {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 9px 13px;
  color: #dce4f8;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: 10px;
  font-size: 0.88rem;
  font-weight: 650;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
}

body > header nav a:hover,
body > header .back-btn:hover,
body > header .login-btn:hover {
  color: #e6c866;
  background: rgba(212, 175, 55, 0.1);
  border-color: rgba(230, 200, 102, 0.5);
  transform: translateY(-1px);
}

body > header nav a:focus-visible,
body > header .back-btn:focus-visible,
body > header .login-btn:focus-visible {
  outline: 2px solid #e6c866;
  outline-offset: 3px;
}

body > header .login-btn {
  color: #0a1330;
  background: linear-gradient(135deg, #e6c866, #d4af37 58%, #b48f1f);
  border-color: rgba(230, 200, 102, 0.7);
}

body > header .login-btn:hover {
  color: #0a1330;
  background: linear-gradient(135deg, #f0d77e, #d4af37);
}

@media (max-width: 700px) {
  body > header {
    gap: 10px 14px;
    min-height: auto;
    padding: 12px 16px;
  }

  body > header > .brand,
  body > header > .header-inner {
    flex-basis: 100%;
    flex-wrap: wrap;
    gap: 10px 12px;
  }

  body > header .brand-home {
    gap: 11px;
  }

  body > header nav {
    flex: 1 1 100%;
    justify-content: flex-start;
    flex-wrap: wrap;
    gap: 6px;
  }

  body > header nav a,
  body > header .back-btn,
  body > header .login-btn {
    min-height: 38px;
    padding: 8px 11px;
    font-size: 0.82rem;
  }
}

@media (max-width: 420px) {
  body > header .logo {
    width: 48px;
    height: 48px;
    border-radius: 13px;
  }

  body > header h1,
  body > header .brand-text strong {
    font-size: 1rem;
  }

  body > header .brand p,
  body > header .brand-text > span {
    font-size: 0.78rem;
  }
}

</style>
<link rel="stylesheet" href="/site-theme.css">
<link rel="icon" type="image/png" href="/assets/logo-gendarmerie.png">
</head>
<body>

<header>
    <div class="brand">
        <a class="brand-home" href="/dashboard" aria-label="Retour au tableau de bord"><img src="/assets/logo-gendarmerie.png" class="logo" alt="Logo Gendarmerie">
        <h1>Gendarmerie Nationale</h1></a>
        <a href="/" class="back-btn">← Retour</a>
    </div>
</header>

<main>
    <div class="login-container">
        <h2>Connexion Gendarme</h2>
        
        <div class="success-message" id="successMessage">
            ✓ Connexion réussie. Redirection...
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="matricule">Matricule *</label>
                <input type="text" id="matricule" name="matricule" placeholder="Votre matricule" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe *</label>
                <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
            </div>

            <button type="submit" class="submit-btn">Se connecter</button>
        </form>
    </div>
</main>

<footer>
    <p>© 2026 lexy_off1 — Tous droits réservés</p>
</footer>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = {
        matricule: document.getElementById('matricule').value,
        password: document.getElementById('password').value
    };

    fetch("/api/login", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('successMessage').style.display = 'block';
        localStorage.setItem('token', data.token);
        
        setTimeout(() => {
            window.location.href = '/tableau-de-bord.html';
        }, 2000);
    })
    .catch(err => {
        console.error('Erreur:', err);
        alert('Erreur de connexion. Veuillez réessayer.');
    });
});
</script>

</body>
</html>
